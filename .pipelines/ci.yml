pipeline:
  name: "Calctl Public Pipeline"

stages:
  - smoke
  - build

smoke:
  - stage: smoke
  - image: python:3.11-slim
  - script:
    - "python --version"
    - "python -m pip install --upgrade pip"
    - "pip install -r requirements.txt"
    - "pip install -e ."
    - "pwd"
    - "ls -la"
    - "python -c \"print('smoke ok')\""

build:
  - stage: build
  - image: python:3.11-slim
  - script:
    - "python -m pip install --upgrade pip"
    - "pip install build"
    - "python -m build"
