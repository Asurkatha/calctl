pipeline:
  name: "Calctl CI Pipeline"

stages:
  - test
  - lint
  - build
  - publish

test:
  - stage: test
  - image: python:3.11-slim
  - script:
    - "python -m pip install --upgrade pip"
    - "pip install -r requirements.txt"
    - "pip install -e ."
    - "pytest --cov=calctl --cov-report=html --cov-report=xml tests/"

lint:
  - stage: lint
  - image: python:3.11-slim
  - script:
    - "python -m pip install --upgrade pip"
    - "pip install flake8 black mypy"
    - "pip install -r requirements.txt"
    - "pip install -e ."
    - "flake8 src/ --max-line-length=100 --exclude=__pycache__"
    - "black --check src/"

build:
  - stage: build
  - image: python:3.11-slim
  - script:
    - "python -m pip install --upgrade pip"
    - "pip install build"
    - "python -m build"

publish:
  - stage: publish
  - image: docker:27-cli
  - script:
    - "echo publish step placeholder"
